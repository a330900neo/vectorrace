<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>F1 物理賽車對戰</title>
<style>
  :root{--bg:#0f1420;--panel:#1a2233;--accent:#4fd1c5;--p1:#ff5964;--p2:#3aa6ff;--text:#eef2f8;--muted:#8a93a6;}
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:"Microsoft JhengHei","PingFang TC",sans-serif;overflow:hidden;}
  #homeScreen{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;overflow-y:auto;padding:20px 12px;}
  #homeScreen h1{font-size:2.2em;letter-spacing:2px;margin:0;}
  #homeScreen p.sub{color:var(--muted);margin-top:-14px;text-align:center;max-width:520px;line-height:1.5;}
  .bigBtn{padding:18px 40px;font-size:1.1em;border-radius:12px;cursor:pointer;background:var(--panel);color:var(--text);border:2px solid transparent;transition:all .15s;min-width:220px;}
  .bigBtn:hover{border-color:var(--accent);transform:translateY(-2px);}
  #diffBox{display:none;flex-direction:column;gap:12px;align-items:center;margin-top:6px;}
  #diffBox.show{display:flex;}
  .diffRow{display:flex;gap:10px;}
  .diffBtn{padding:10px 24px;border-radius:8px;border:2px solid var(--muted);background:transparent;color:var(--text);cursor:pointer;}
  .diffBtn.sel{border-color:var(--accent);color:var(--accent);}
  #gameScreen{display:none;height:100%;flex-direction:column;}
  #topbar{display:flex;align-items:center;gap:12px;padding:8px 14px;background:var(--panel);flex-wrap:wrap;}
  .badge{padding:5px 12px;border-radius:20px;font-weight:bold;background:#26314a;font-variant-numeric:tabular-nums;}
  #timerWrap{height:6px;background:#26314a;}
  #timerBar{height:100%;width:100%;background:var(--accent);}
  #canvasWrap{flex:1;min-height:0;position:relative;overflow:hidden;cursor:grab;touch-action:none;}
  canvas{display:block;background:#0c1119;touch-action:none;}
  .ctrlBtn{background:#26314a;border:1px solid #3a4864;color:var(--text);padding:6px 12px;border-radius:6px;cursor:pointer;}
  .ctrlBtn.on{border-color:var(--accent);color:var(--accent);}
  #overlay{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.6);}
  #overlay.show{display:flex;}
  #overlayBox{background:var(--panel);padding:28px 36px;border-radius:14px;text-align:center;max-width:90vw;}
  #overlayBox .bigBtn{margin:4px;}
  .spacer{flex:1;}
  .dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;}
  #controls{display:flex;justify-content:space-between;align-items:stretch;gap:10px;padding:8px 12px;background:var(--panel);border-top:1px solid #2a3552;}
  .pPanel{display:flex;gap:12px;align-items:center;flex:1;min-width:0;}
  .pPanel.right{flex-direction:row-reverse;}
  .stick{position:relative;width:128px;height:128px;flex:none;border-radius:18px;background:#10172a;border:2px solid var(--c);touch-action:none;user-select:none;}
  .stick::before,.stick::after{content:"";position:absolute;background:#2a3552;}
  .stick::before{left:50%;top:6px;bottom:6px;width:1px;}
  .stick::after{top:50%;left:6px;right:6px;height:1px;}
  .stick span{position:absolute;font-size:10px;color:var(--muted);pointer-events:none;}
  .stick .u{top:3px;left:50%;transform:translateX(-50%);} .stick .d{bottom:3px;left:50%;transform:translateX(-50%);}
  .stick .l{left:4px;top:50%;transform:translateY(-50%);} .stick .r{right:4px;top:50%;transform:translateY(-50%);}
  .knob{position:absolute;left:50%;top:50%;width:38px;height:38px;margin:-19px 0 0 -19px;border-radius:50%;background:var(--c);box-shadow:0 2px 8px #0008;pointer-events:none;}
  .stick.locked{opacity:.45;}
  .info{display:flex;flex-direction:column;gap:3px;font-size:.85em;min-width:0;font-variant-numeric:tabular-nums;}
  .info .name{font-weight:bold;color:var(--c);}
  .info .spd{font-size:1.6em;font-weight:bold;}
  .info .spd small{font-size:.5em;color:var(--muted);}
  .info .mut{color:var(--muted);}
  .okBtn{margin-top:3px;padding:8px 14px;border-radius:8px;border:2px solid var(--c);background:transparent;color:var(--text);cursor:pointer;font-weight:bold;}
  .okBtn:disabled{opacity:.5;cursor:default;}
  @media (max-width:700px){
    #homeScreen{justify-content:flex-start;padding-top:32px;}
    #homeScreen h1{font-size:1.5em;}
    .bigBtn{padding:16px 22px;min-width:0;width:100%;max-width:320px;font-size:1em;}
    .diffRow{flex-wrap:wrap;justify-content:center;}
    .diffBtn{padding:10px 16px;font-size:.9em;}
    #topbar{gap:6px;padding:6px 8px;} .badge{padding:4px 9px;font-size:.85em;}
    .ctrlBtn{padding:7px 9px;font-size:.85em;}
    #controls{padding:6px;gap:6px;}
    .stick{width:104px;height:104px;} .pPanel,.pPanel.right{flex-direction:column;gap:4px;} .info{align-items:center;font-size:.78em;}
    #hint{display:none;}
  }
  .nameRow{display:flex;align-items:center;gap:6px;}
  .wheel{width:40px;height:40px;flex:none;}
  .wheel svg{width:100%;height:100%;display:block;}
  #replayBar{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);display:none;align-items:center;gap:8px;background:rgba(26,34,51,.94);padding:8px 12px;border-radius:12px;width:min(580px,94%);border:1px solid #3a4864;}
  #replayBar.show{display:flex;}
  #replayBar input[type=range]{flex:1;min-width:0;accent-color:var(--accent);}
  #rpTime{font-variant-numeric:tabular-nums;font-size:.85em;color:var(--muted);min-width:84px;text-align:center;}
</style>
</head>
<body>

<div id="homeScreen">
  <h1>🏎️ F1 物理賽車對戰</h1>
  <p class="sub">真實 F1 尺度（賽道闊 14 m、起跑長直路、髮夾／高速彎／連續彎）。四輪全部越出白線才算出界。每一步 1 秒，雙方同時用搖桿設定加速／煞車與轉向（單位：秒、km/h），每步最多 8 秒決策；雙方都確認後同步跑 1 秒物理模擬。先衝過終點線者勝，撞牆即出局；賽車之間會真實碰撞，賽後可重播整場。</p>

  <div style="display:flex;flex-direction:column;gap:14px;align-items:center;">
    <div>
      <div style="color:var(--muted);margin-bottom:6px;text-align:center;">賽道長度（起點 → 終點）</div>
      <div class="diffRow" id="lengthRow"><button class="diffBtn" data-km="1.5">短 1.5 km</button><button class="diffBtn sel" data-km="3">標準 3 km</button><button class="diffBtn" data-km="4.5">長 4.5 km</button><button class="diffBtn" data-km="6">F1 6 km</button></div>
    </div>
  </div>

  <button class="bigBtn" id="btnPvp">👥 雙人對戰（同機雙搖桿）</button>
  <button class="bigBtn" id="btnAi">🤖 人機對戰</button>
  <div id="diffBox">
    <div style="color:var(--muted)">選擇 AI 難度</div>
    <div class="diffRow">
      <button class="diffBtn" data-d="easy">簡單</button>
      <button class="diffBtn sel" data-d="medium">中等</button>
      <button class="diffBtn" data-d="hard">困難</button>
    </div>
    <button class="bigBtn" id="btnStartAi" style="margin-top:6px;">開始遊戲</button>
  </div>
</div>

<div id="gameScreen">
  <div id="topbar">
    <div class="badge" id="stepBadge">步驟 1</div>
    <div class="badge" id="timeBadge">0 s</div>
    <div class="badge" id="phaseBadge">決策中</div>
    <div id="hint" style="font-size:.8em;color:var(--muted)">搖桿：上=加速 下=煞車 左右=轉向｜鍵盤 P1：WASD＋空白　P2：方向鍵＋Enter</div>
    <div class="spacer"></div>
    <button class="ctrlBtn" id="btnFollow">🎥 跟車</button>
    <button class="ctrlBtn" id="btnZoomOut">－</button>
    <button class="ctrlBtn" id="btnZoomIn">＋</button>
    <button class="ctrlBtn" id="btnReset">全景</button>
    <button class="ctrlBtn" id="btnHome">主頁</button>
  </div>
  <div id="timerWrap"><div id="timerBar"></div></div>
  <div id="canvasWrap">
    <canvas id="cv"></canvas>
    <div id="overlay"><div id="overlayBox">
      <h2 id="overlayTitle"></h2><p id="overlayMsg"></p>
      <button class="bigBtn" id="btnReplay">🔁 重播</button>
      <button class="bigBtn" id="btnAgain">再來一局（新賽道）</button>
      <button class="bigBtn" id="btnBackHome">返回主頁</button>
    </div></div>
    <div id="replayBar"><button class="ctrlBtn" id="rpPlay">⏸</button><input type="range" id="rpSlider" min="0" max="1000" value="0"><span id="rpTime">0.0 / 0 s</span><button class="ctrlBtn" id="rpSpeed">1×</button><button class="ctrlBtn" id="rpExit">✕ 結束</button></div>
  </div>
  <div id="controls">
    <div class="pPanel" id="panel0" style="--c:var(--p1)">
      <div class="stick" id="stick0"><span class="u">加速</span><span class="d">煞車</span><span class="l">左</span><span class="r">右</span><div class="knob"></div></div>
      <div class="info"><div class="nameRow"><div class="wheel" id="wheel0"></div><div class="name">玩家1</div></div><div class="spd"><span id="spd0">0</span> <small>km/h</small></div>
        <div class="mut" id="rd0"></div><div class="mut" id="pv0"></div><button class="okBtn" id="ok0">確認 OK</button></div>
    </div>
    <div class="pPanel right" id="panel1" style="--c:var(--p2)">
      <div class="stick" id="stick1"><span class="u">加速</span><span class="d">煞車</span><span class="l">左</span><span class="r">右</span><div class="knob"></div></div>
      <div class="info" style="align-items:flex-end"><div class="nameRow"><div class="wheel" id="wheel1"></div><div class="name" id="name1">玩家2</div></div><div class="spd"><span id="spd1">0</span> <small>km/h</small></div>
        <div class="mut" id="rd1"></div><div class="mut" id="pv1"></div><button class="okBtn" id="ok1">確認 OK</button></div>
    </div>
  </div>
</div>

<script>
(function(){
'use strict';

let GRID = 1200;           // 場地邊長（米，由賽道長度自動決定）
let trackKm = 3;
let mode = 'pvp';
let aiDifficulty = 'medium';

const M = 1;               // 1 unit = 1 米
const DECIDE_MS = 8000;    // 每步最長決策時間
const DT = 0.02, SUB = 50; // 每步 1 秒 = 50 個 0.02s 物理子步
const DIFF = {
  easy:   {depth:2, beam:2, noise:0.35, cap:0.75},
  medium: {depth:3, beam:3, noise:0.07, cap:1},
  hard:   {depth:4, beam:3, noise:0,    cap:1}
};

// F1 風格車輛參數（SI 單位：m, s）
const CAR = {L:3.6, PWR:390, AMAX:13, BMAX:42, DRAG:0.0009, MU0:1.6, DF:0.0005, SCRUB:0.25};

let track=null, players=[], step=0, phase='idle', deadline=0, simStart=0, gameOver=false, follow=false, running=false;
let scale=6, offsetX=40, offsetY=40;
let history=[], hitMarks=[], curHits=[], replay=null, lastFrame=0;

const cv=document.getElementById('cv'), ctx=cv.getContext('2d'), wrap=document.getElementById('canvasWrap');
function resizeCanvas(){ cv.width=wrap.clientWidth; cv.height=wrap.clientHeight; draw(); }
window.addEventListener('resize', ()=>{ resizeCanvas(); players.forEach(renderStick); });
function toPx(gx,gy){ return {x:offsetX+gx*scale, y:offsetY+gy*scale}; }
function toGrid(px,py){ return {x:(px-offsetX)/scale, y:(py-offsetY)/scale}; }
function fitView(){
  const pad=30, aw=wrap.clientWidth-pad*2, ah=wrap.clientHeight-pad*2;
  scale=Math.max(0.05, Math.min(aw,ah)/GRID);
  offsetX=(wrap.clientWidth-GRID*scale)/2; offsetY=(wrap.clientHeight-GRID*scale)/2;
}

// ---------- 幾何工具 ----------
function dist(a,b){ return Math.hypot(a.x-b.x, a.y-b.y); }
function addV(a,b){ return {x:a.x+b.x, y:a.y+b.y}; }
function clampNum(v,lo,hi){ return Math.max(lo,Math.min(hi,v)); }

function catmullRom(p0,p1,p2,p3,t){
  const t2=t*t, t3=t2*t;
  const x = 0.5*((2*p1.x)+(-p0.x+p2.x)*t+(2*p0.x-5*p1.x+4*p2.x-p3.x)*t2+(-p0.x+3*p1.x-3*p2.x+p3.x)*t3);
  const y = 0.5*((2*p1.y)+(-p0.y+p2.y)*t+(2*p0.y-5*p1.y+4*p2.y-p3.y)*t2+(-p0.y+3*p1.y-3*p2.y+p3.y)*t3);
  return {x,y};
}

function pointInPolygon(pt, poly){
  let inside = false;
  for(let i=0,j=poly.length-1;i<poly.length;j=i++){
    const xi=poly[i].x, yi=poly[i].y, xj=poly[j].x, yj=poly[j].y;
    const intersect = ((yi>pt.y)!==(yj>pt.y)) &&
      (pt.x < (xj-xi)*(pt.y-yi)/(yj-yi)+xi);
    if(intersect) inside = !inside;
  }
  return inside;
}

// ---------- 賽道生成 ----------

// 以三點估算中心線的局部曲率半徑（Menger curvature），用來限制賽道半寬，
// 避免內彎角的半寬大於彎道半徑而令左右邊界互相穿過/重疊
function curvatureRadius(p0,p1,p2){
  const a = dist(p1,p2), b = dist(p0,p2), c = dist(p0,p1);
  if(a<1e-6||b<1e-6||c<1e-6) return Infinity;
  const area = Math.abs((p1.x-p0.x)*(p2.y-p0.y)-(p2.x-p0.x)*(p1.y-p0.y))/2;
  if(area<1e-6) return Infinity;
  const k = 4*area/(a*b*c);
  if(k<1e-9) return Infinity;
  return 1/k;
}

function segIntersect(p1,p2,p3,p4){
  function ccw(a,b,c){ return (c.y-a.y)*(b.x-a.x) - (b.y-a.y)*(c.x-a.x); }
  const d1=ccw(p3,p4,p1), d2=ccw(p3,p4,p2), d3=ccw(p1,p2,p3), d4=ccw(p1,p2,p4);
  return (((d1>0&&d2<0)||(d1<0&&d2>0)) && ((d3>0&&d4<0)||(d3<0&&d4>0)));
}

// 檢查一條折線（如賽道左/右邊界）是否自我相交
function polylineSelfIntersects(pts){
  const n = pts.length;
  for(let i=0;i<n-1;i++){
    for(let j=i+2;j<n-1;j++){
      if(i===0 && j===n-2) continue;
      if(segIntersect(pts[i],pts[i+1],pts[j],pts[j+1])) return true;
    }
  }
  return false;
}

// 中心線上某點與「非鄰近路段」之間的最短距離，用來偵測賽道是否繞回自己附近
function minSelfDistance(center, i, gap){
  let best = Infinity;
  for(let j=0;j<center.length;j++){
    if(Math.abs(i-j) < gap) continue;
    const d = dist(center[i], center[j]);
    if(d<best) best=d;
  }
  return best;
}

function generateTrack(attempt){
  attempt=attempt||0;
  // 真實 F1 尺度：1 unit = 1 m。賽道闊 14 m；起跑後先有一條長直路；
  // 之後由「髮夾／慢彎／中速彎／高速彎／連續彎(chicane/esses)」搭配長短不一的直路組成，
  // 髮夾後接長直路（煞車點），高速彎後接短直路。每段加入前都檢查場地邊界及與自身路段的間距。
  const HW=7, TARGET=trackKm*1000, SP=4;
  GRID=Math.round(Math.sqrt(TARGET)*22/50)*50;
  const margin=HW+25, selfBuf=HW*2+24, skipN=Math.ceil(64/SP);
  const rnd=(a,b)=>a+Math.random()*(b-a);
  const center=[{x:margin, y:GRID/2+rnd(-0.15,0.15)*GRID}];
  let pos={...center[0]}, heading=rnd(-0.12,0.12), curLen=0;

  function trace(p0,h0,prims){
    let p={...p0}, h=h0, len=0; const pts=[];
    for(const pr of prims){
      if(pr.s!==undefined){
        const n=Math.max(1,Math.ceil(pr.s/SP));
        for(let i=1;i<=n;i++) pts.push({x:p.x+Math.cos(h)*pr.s*i/n, y:p.y+Math.sin(h)*pr.s*i/n});
        p={...pts[pts.length-1]}; len+=pr.s;
      } else {
        const sg=Math.sign(pr.a), ang=Math.abs(pr.a), r=pr.r, n=Math.max(2,Math.ceil(ang*r/SP));
        const cx=p.x+Math.cos(h+Math.PI/2*sg)*r, cy=p.y+Math.sin(h+Math.PI/2*sg)*r, a0=Math.atan2(p.y-cy,p.x-cx);
        for(let i=1;i<=n;i++){ const a=a0+sg*ang*i/n; pts.push({x:cx+Math.cos(a)*r, y:cy+Math.sin(a)*r}); }
        p={...pts[pts.length-1]}; h+=sg*ang; len+=ang*r;
      }
    }
    return {pts,pos:p,heading:h,len};
  }
  function ok(pts){
    const lim=center.length-skipN;
    for(const p of pts){
      if(p.x<margin||p.x>GRID-margin||p.y<margin||p.y>GRID-margin) return false;
      for(let j=0;j<lim;j+=2) if(dist(p,center[j])<selfBuf) return false;
    }
    return true;
  }
  function commit(r){ r.pts.forEach(p=>center.push(p)); pos=r.pos; heading=r.heading; curLen+=r.len; }

  const KINDS={
    hairpin:()=>[{r:rnd(24,40),a:rnd(2.6,3.1)}],
    slow:   ()=>[{r:rnd(40,75),a:rnd(1.2,1.9)}],
    medium: ()=>[{r:rnd(90,160),a:rnd(0.7,1.5)}],
    fast:   ()=>[{r:rnd(220,420),a:rnd(0.3,1.0)}],
    chicane:()=>{const r=rnd(55,90),a=rnd(0.4,0.65); return [{r,a},{s:rnd(8,20)},{r,a:-a}];},
    esses:  ()=>{const r=rnd(70,130),a=rnd(0.3,0.5); return [{r,a},{r,a:-2*a},{r,a}];}
  };
  const AFTER={hairpin:[250,700], slow:[150,450], medium:[80,300], fast:[60,250], chicane:[150,400], esses:[120,300]};
  const W=[['hairpin',.12],['slow',.2],['medium',.25],['fast',.2],['chicane',.13],['esses',.1]];
  function pick(){ let x=Math.random(); for(const [k,w] of W){ if((x-=w)<0) return k; } return 'medium'; }

  // 起跑後長直路
  const startLen=Math.max(350,Math.min(800,TARGET*0.15))*rnd(0.9,1.1);
  const r0=trace(pos,heading,[{s:startLen}]);
  if(!ok(r0.pts)){ if(attempt<40) return generateTrack(attempt+1); }
  commit(r0);

  let guard=0, lastKind='';
  while(curLen<TARGET && guard++<300){
    let placed=false;
    for(let t=0;t<40&&!placed;t++){
      let kind=pick(); if(kind==='hairpin'&&lastKind==='hairpin'&&t<20) kind='medium';
      let sign=Math.random()<0.5?1:-1;
      const toC=Math.atan2(GRID/2-pos.y, GRID/2-pos.x);
      const diff=((toC-heading+Math.PI*3)%(Math.PI*2))-Math.PI;
      if(Math.abs(diff)>0.4 && Math.random()<0.7) sign=diff>0?1:-1;
      const prims=KINDS[kind]().map(pr=>pr.a!==undefined?{r:pr.r,a:pr.a*sign}:pr);
      const f=t>30?0.3:t>20?0.5:1, [a,b]=AFTER[kind];
      prims.push({s:rnd(a,b)*f});
      const r=trace(pos,heading,prims);
      if(ok(r.pts)){ commit(r); lastKind=kind; placed=true; }
    }
    if(!placed) break;
  }
  if(curLen<TARGET*0.6 && attempt<40) return generateTrack(attempt+1);
  // 終點直路
  for(const L of [450,350,250,150,80]){ const r=trace(pos,heading,[{s:L}]); if(ok(r.pts)){ commit(r); break; } }

  const arcLen=[0];
  for(let i=1;i<center.length;i++) arcLen.push(arcLen[i-1]+dist(center[i-1],center[i]));
  const curvature=center.map((p,i)=>curvatureRadius(center[Math.max(0,i-4)],p,center[Math.min(center.length-1,i+4)]));
  const halfWidths=center.map(()=>HW);
  const left=[], right=[];
  for(let i=0;i<center.length;i++){
    const p0=center[Math.max(0,i-1)], p1=center[Math.min(center.length-1,i+1)];
    let tx=p1.x-p0.x, ty=p1.y-p0.y; const l=Math.hypot(tx,ty)||1; tx/=l; ty/=l;
    left.push({x:center[i].x-ty*HW, y:center[i].y+tx*HW});
    right.push({x:center[i].x+ty*HW, y:center[i].y-tx*HW});
  }
  if((polylineSelfIntersects(left)||polylineSelfIntersects(right)) && attempt<40) return generateTrack(attempt+1);
  const polygon=left.concat(right.slice().reverse());
  const s0=center[0], s1=center[1];
  let tx=s1.x-s0.x, ty=s1.y-s0.y; const tl=Math.hypot(tx,ty)||1; tx/=tl; ty/=tl;
  const FW=8, LAT=2.5; // 起步位置：起跑線前 8 m，左右各偏 2.5 m
  const last=center.length-1;
  return {
    center,left,right,polygon,halfWidths,arcLen,curvature,
    startGate:[left[0],right[0]], finishGate:[left[last],right[last]],
    p1Start:{x:s0.x+tx*FW-(-ty)*LAT, y:s0.y+ty*FW-tx*LAT},
    p2Start:{x:s0.x+tx*FW+(-ty)*LAT, y:s0.y+ty*FW+tx*LAT}
  };
}

function isOnTrack(pt){
  if(pt.x<0||pt.x>GRID||pt.y<0||pt.y>GRID) return false;
  return pointInPolygon(pt, track.polygon);
}
// 快速判定（AI 用）：只搜尋中心線附近一小段，距離中心線 ≤ 半寬 即在賽道上
function nearestCenter(pt, hint){
  const c=track.center, lo=Math.max(0,hint-30), hi=Math.min(c.length-1,hint+30);
  let bi=lo, bd=Infinity;
  for(let i=lo;i<=hi;i++){ const d=(pt.x-c[i].x)**2+(pt.y-c[i].y)**2; if(d<bd){bd=d;bi=i;} }
  return {idx:bi, d:Math.sqrt(bd)};
}
function globalNearest(pt){
  const c=track.center; let bi=0, bd=Infinity;
  for(let i=0;i<c.length;i++){ const d=(pt.x-c[i].x)**2+(pt.y-c[i].y)**2; if(d<bd){bd=d;bi=i;} }
  return {idx:bi, d:Math.sqrt(bd)};
}

// ---------- 物理模型 ----------
// c: {x,y (unit), h (rad), v (m/s), ts (油門致動器 -1..1), ss (轉向致動器 -1..1)}
// 油門/轉向帶有致動器速率限制；動力受功率限制；抓地力＝基礎＋下壓力(∝v²)；
// 縱向與橫向加速度共用摩擦圓；轉向過度時進入轉向不足（轉彎能力封頂並損失速度）
function stepCar(c, thr, str, dt){
  c.ts += clampNum(thr-c.ts, -6*dt, 6*dt);
  c.ss += clampNum(str-c.ss, -3*dt, 3*dt);
  const no=c.nOut||0, v=c.v, grip=9.8*(CAR.MU0+CAR.DF*v*v)*(1-0.15*no); // 每個輪越線：抓地力 -15%、額外阻力
  let aL = c.ts>=0 ? c.ts*Math.min(CAR.AMAX, CAR.PWR/Math.max(v,5)) : c.ts*CAR.BMAX;
  aL = clampNum(aL,-grip,grip);
  const latCap = Math.sqrt(Math.max(0, grip*grip-aL*aL));
  const delta = c.ss*0.4/(1+(v/22)*(v/22));
  const tn = Math.tan(delta);
  const aDes = v*v/CAR.L*tn;
  let yaw = v/CAR.L*tn, slip=0;
  if(Math.abs(aDes)>latCap){ yaw=Math.sign(aDes)*latCap/Math.max(v,0.1); slip=Math.abs(aDes)-latCap; }
  c.slip=slip; c.aL=aL;
  c.v=Math.max(0, v+(aL-CAR.DRAG*v*v-slip*CAR.SCRUB-(v>0?3*no:0))*dt);
  c.h+=yaw*dt;
  c.x+=Math.cos(c.h)*c.v*dt/M; c.y+=Math.sin(c.h)*c.v*dt/M;
}
function wheelPts(c){
  const ch=Math.cos(c.h), sh=Math.sin(c.h), o=[];
  for(const fx of [CAR.L/2,-CAR.L/2]) for(const fy of [-0.8,0.8]) o.push({x:c.x+ch*fx-sh*fy, y:c.y+sh*fx+ch*fy});
  return o;
}
// 數有幾個輪在賽道外（4 個全部出界＝撞牆出局）
function wheelsOut(c,fast){
  let n=0;
  for(const w of wheelPts(c)){
    if(w.x<0||w.x>GRID||w.y<0||w.y>GRID){ n++; continue; }
    if(fast){ const nc=nearestCenter(w,c.idx); if(nc.d>track.halfWidths[nc.idx]) n++; }
    else if(!pointInPolygon(w,track.polygon)) n++;
  }
  return n;
}
// 模擬 n 個子步；回傳終態、逐幀軌跡、事件（過線 finish / 撞牆 crash 及其發生時間）
function simulate(c0, cmd, dt, n, fast){
  const c={...c0}, frames=[{x:c.x,y:c.y,h:c.h,v:c.v,ss:c.ss}]; let ev=null;
  const g0=track.finishGate[0], g1=track.finishGate[1];
  for(let i=1;i<=n;i++){
    const a={x:c.x,y:c.y};
    stepCar(c, cmd.thr, cmd.str, dt);
    frames.push({x:c.x,y:c.y,h:c.h,v:c.v,ss:c.ss});
    if(segIntersect(a,c,g0,g1)){ ev={type:'finish',t:i*dt}; break; }
    if(fast){
      const nc=nearestCenter(c, c.idx); c.idx=nc.idx; c.lat=nc.d;
    }
    c.nOut=wheelsOut(c,fast);
    if(c.nOut>=4){ ev={type:'crash',t:i*dt}; break; }
  }
  return {car:c, frames, ev};
}

// ---------- 車與車碰撞（旋轉矩形 SAT） ----------
function carBox(c){ const ch=Math.cos(c.h), sh=Math.sin(c.h); return {x:c.x+ch*0.25, y:c.y+sh*0.25, ux:ch, uy:sh, hl:2.65, hw:0.95}; }
function obbHit(A,B){
  const axes=[[A.ux,A.uy],[-A.uy,A.ux],[B.ux,B.uy],[-B.uy,B.ux]], dx=B.x-A.x, dy=B.y-A.y; let best=null;
  for(const [ax,ay] of axes){
    const rA=A.hl*Math.abs(ax*A.ux+ay*A.uy)+A.hw*Math.abs(-ax*A.uy+ay*A.ux);
    const rB=B.hl*Math.abs(ax*B.ux+ay*B.uy)+B.hw*Math.abs(-ax*B.uy+ay*B.ux);
    const d=dx*ax+dy*ay, ov=rA+rB-Math.abs(d);
    if(ov<=0) return null;
    if(!best||ov<best.d){ const sg=d<0?-1:1; best={nx:ax*sg, ny:ay*sg, d:ov, rA}; }
  }
  best.px=A.x+best.nx*(best.rA-best.d/2); best.py=A.y+best.ny*(best.rA-best.d/2);
  return best;
}
// 分開重疊、交換動量（恢復係數 0.25、少量切向摩擦），車頭被撞偏、損失速度
function resolveCollision(a,b){
  const h=obbHit(carBox(a),carBox(b)); if(!h) return null;
  const sp=h.d/2+0.01; a.x-=h.nx*sp; a.y-=h.ny*sp; b.x+=h.nx*sp; b.y+=h.ny*sp;
  const va={x:Math.cos(a.h)*a.v,y:Math.sin(a.h)*a.v}, vb={x:Math.cos(b.h)*b.v,y:Math.sin(b.h)*b.v};
  const rel=(vb.x-va.x)*h.nx+(vb.y-va.y)*h.ny, power=Math.max(0,-rel);
  if(rel<0){
    const j=-(1.25)*rel/2; va.x-=j*h.nx; va.y-=j*h.ny; vb.x+=j*h.nx; vb.y+=j*h.ny;
    const tx=-h.ny, ty=h.nx, f=0.1*((vb.x-va.x)*tx+(vb.y-va.y)*ty);
    va.x+=f*tx; va.y+=f*ty; vb.x-=f*tx; vb.y-=f*ty;
  }
  [[a,va],[b,vb]].forEach(([c,v])=>{
    if(Math.hypot(v.x,v.y)>1.5){ let d=Math.atan2(v.y,v.x)-c.h; d=Math.atan2(Math.sin(d),Math.cos(d)); c.h+=d*0.5; }
    c.v=Math.max(0,(v.x*Math.cos(c.h)+v.y*Math.sin(c.h))*0.97);
  });
  return {x:h.px,y:h.py,power};
}
// 雙車同步模擬（含碰撞）。回傳每位玩家的 {car,frames,ev} 與碰撞事件
function simulateJoint(cmds){
  const cs=players.map(p=>({...p.car})), snap=c=>({x:c.x,y:c.y,h:c.h,v:c.v,ss:c.ss});
  const fr=cs.map(c=>[snap(c)]), evs=[null,null], hits=[], g0=track.finishGate[0], g1=track.finishGate[1]; let lastHit=-1;
  for(let i=1;i<=SUB;i++){
    const t=i*DT;
    cs.forEach((c,k)=>{ if(evs[k]) return; const a={x:c.x,y:c.y}; stepCar(c,cmds[k].thr,cmds[k].str,DT);
      if(segIntersect(a,c,g0,g1)){ evs[k]={type:'finish',t}; fr[k].push(snap(c)); } });
    if(!evs[0]&&!evs[1]){ const h=resolveCollision(cs[0],cs[1]); if(h&&h.power>1&&t-lastHit>=0.2){ hits.push({t,x:h.x,y:h.y,power:h.power}); lastHit=t; } }
    cs.forEach((c,k)=>{ if(evs[k]) return; c.nOut=wheelsOut(c,false); if(c.nOut>=4) evs[k]={type:'crash',t}; fr[k].push(snap(c)); });
    if(evs[0]&&evs[1]) break;
  }
  return {res:cs.map((c,k)=>({car:c,frames:fr[k],ev:evs[k]})), hits};
}

// ---------- 遊戲流程 ----------
function newPlayer(id,color,start,h,isAI){
  return {id,color,isAI, car:{x:start.x,y:start.y,h,v:0,ts:0,ss:0,idx:0,slip:0,nOut:0}, stick:{x:0,y:0.6}, wheel:0,
          trail:[{x:start.x,y:start.y}], marks:[], ready:false, cmd:null, sim:null, preview:null, finT:null};
}
function initGame(){
  track=generateTrack();
  const c1=getComputedStyle(document.documentElement).getPropertyValue('--p1').trim();
  const c2=getComputedStyle(document.documentElement).getPropertyValue('--p2').trim();
  const t=track.center[Math.min(3,track.center.length-1)], s=track.center[0];
  const h=Math.atan2(t.y-s.y, t.x-s.x);
  players=[ newPlayer(0,c1,track.p1Start,h,false), newPlayer(1,c2,track.p2Start,h,mode==='ai') ];
  players.forEach(p=>{ p.car.idx=globalNearest(p.car).idx; });
  document.getElementById('name1').textContent = mode==='ai' ? `AI (${{easy:'簡單',medium:'中等',hard:'困難'}[aiDifficulty]})` : '玩家2';
  document.getElementById('stick1').style.display = mode==='ai' ? 'none' : '';
  document.getElementById('ok1').style.display = mode==='ai' ? 'none' : '';
  document.getElementById('pv1').style.display = mode==='ai' ? 'none' : '';
  step=0; gameOver=false; phase='idle'; history=[]; hitMarks=[]; curHits=[]; replay=null; document.getElementById('replayBar').classList.remove('show');
  fitView(); if(follow) scale=4.5; beginStep();
  if(!running){ running=true; requestAnimationFrame(loop); }
}
function beginStep(){
  step++; phase='decide'; deadline=performance.now()+DECIDE_MS;
  players.forEach(p=>{ p.ready=false; p.cmd=null; p.sim=null; }); curHits=[];
  players.forEach(p=>{
    if(p.isAI){ setTimeout(()=>aiDecide(p), 60); }
    else { updatePreview(p); renderStick(p); }
  });
  updatePanels();
}
function setReady(p){
  if(phase!=='decide'||p.ready||gameOver) return;
  p.ready=true; p.cmd={thr:p.stick.y, str:p.stick.x};
  updatePanels(); players.forEach(renderStick);
  if(players.every(q=>q.ready)) startSim();
}
function startSim(){
  const r=simulateJoint(players.map(p=>p.cmd)); players.forEach((p,k)=>{ p.sim=r.res[k]; }); curHits=r.hits;
  simStart=performance.now(); phase='sim'; updatePanels();
}
function finishSim(){
  players.forEach(p=>{
    p.car=p.sim.car; p.car.idx=globalNearest(p.car).idx;
    p.sim.frames.forEach((f,i)=>{ if(i>0&&i%2===0) p.trail.push({x:f.x,y:f.y}); });
    const l=p.sim.frames[p.sim.frames.length-1]; p.trail.push({x:l.x,y:l.y}); p.marks.push({x:l.x,y:l.y});
    if(p.sim.ev&&p.sim.ev.type==='finish') p.finT=(step-1)+p.sim.ev.t;
  });
  history.push({frames:players.map(p=>p.sim.frames), hits:curHits.map(h=>({...h,t:h.t+step-1}))});
  curHits.forEach(h=>hitMarks.push({x:h.x,y:h.y}));
  const evs=players.filter(p=>p.sim.ev).map(p=>({p,ev:p.sim.ev})).sort((a,b)=>a.ev.t-b.ev.t);
  phase='idle';
  if(evs.length){
    const f=evs[0], tie=evs[1]&&Math.abs(evs[1].ev.t-f.ev.t)<1e-9&&evs[1].ev.type===f.ev.type;
    if(tie) return endGame(null,'draw');
    if(f.ev.type==='finish') return endGame(f.p,'finish');
    return endGame(players[1-f.p.id],'crash',f.p);
  }
  beginStep();
}
function pname(p){ return p.id===0?'玩家1':(mode==='ai'?'AI':'玩家2'); }
function endGame(winner,reason,loser){
  gameOver=true; phase='over'; updatePanels();
  const T=document.getElementById('overlayTitle'), Mg=document.getElementById('overlayMsg');
  if(reason==='finish'){ T.textContent='🏁 衝線！'; Mg.textContent=`${pname(winner)} 獲勝！用時 ${winner.finT.toFixed(2)} 秒`; }
  else if(reason==='crash'){ T.textContent='💥 撞牆了！'; Mg.textContent=`${pname(loser)} 出界，${pname(winner)} 獲勝！`; }
  else { T.textContent='💥 同時撞牆'; Mg.textContent='平手！'; }
  document.getElementById('overlay').classList.add('show');
}

// ---------- 預覽 / 搖桿 / UI ----------
function updatePreview(p){
  if(p.isAI) return;
  p.preview=simulate(p.car,{thr:p.stick.y,str:p.stick.x},0.05,20,false);
}
function renderStick(p){
  if(p.isAI) return;
  const el=document.getElementById('stick'+p.id), R=(el.clientWidth||104)/2*0.8;
  el.querySelector('.knob').style.transform=`translate(${p.stick.x*R}px,${-p.stick.y*R}px)`;
  el.classList.toggle('locked', p.ready||phase!=='decide');
  const y=p.stick.y, x=p.stick.x;
  document.getElementById('rd'+p.id).textContent =
    (y>=0?`加速 ${Math.round(y*100)}%`:`煞車 ${Math.round(-y*100)}%`)+`｜轉向 ${Math.abs(x)<0.02?'直行':(x<0?'左 ':'右 ')+Math.round(Math.abs(x)*100)+'%'}`;
  if(p.preview){ const f=p.preview.frames; document.getElementById('pv'+p.id).textContent =
    `1s 後預計 ${Math.round(f[f.length-1].v*3.6)} km/h${p.preview.ev?(p.preview.ev.type==='crash'?' ⚠撞牆':' 🏁'):''}${p.preview.car.slip>0.5?' ⚠滑':''}${p.preview.car.nOut>0?' ⚠'+p.preview.car.nOut+'輪越線':''}`; }
}
function updatePanels(){
  players.forEach(p=>{
    if(!p.isAI){ const b=document.getElementById('ok'+p.id); b.disabled=p.ready||phase!=='decide'; b.textContent=p.ready?'已確認 ✓':'確認 OK'; renderStick(p); }
  });
  if(mode==='ai'){ const p=players[1]; document.getElementById('rd1').textContent = phase==='decide' ? (p.ready?'AI 已就緒 ✓':'AI 思考中…') : ''; }
  const pb=document.getElementById('phaseBadge');
  pb.textContent = phase==='decide' ? '決策中' : phase==='sim' ? '模擬 1 秒…' : phase==='over' ? '結束' : phase==='replay' ? '🎬 重播' : '…';
  document.getElementById('stepBadge').textContent='步驟 '+step;
  document.getElementById('timeBadge').textContent='t = '+(phase==='sim'?step:step-1)+' s';
}
function makeStick(id){
  const el=document.getElementById('stick'+id); let act=false;
  const upd=e=>{ const p=players[id]; const r=el.getBoundingClientRect(), R=r.width/2*0.8;
    p.stick.x=clampNum((e.clientX-r.left-r.width/2)/R,-1,1); p.stick.y=clampNum(-(e.clientY-r.top-r.height/2)/R,-1,1);
    if(Math.abs(p.stick.x)<0.04) p.stick.x=0; updatePreview(p); renderStick(p); };
  el.addEventListener('pointerdown',e=>{ const p=players[id]; if(!p||p.ready||phase!=='decide') return; act=true; el.setPointerCapture(e.pointerId); upd(e); e.preventDefault(); });
  el.addEventListener('pointermove',e=>{ if(act) upd(e); });
  ['pointerup','pointercancel'].forEach(n=>el.addEventListener(n,()=>{act=false;}));
}
window.addEventListener('keydown',e=>{
  if(!track||phase!=='decide') return;
  const k=e.key.toLowerCase(); let who=-1,dx=0,dy=0,ok=false;
  if(k.length===1&&'wasd'.includes(k)){ who=0; dy=k==='w'?.1:k==='s'?-.1:0; dx=k==='d'?.1:k==='a'?-.1:0; }
  else if(k.startsWith('arrow')){ who=mode==='ai'?0:1; dy=k==='arrowup'?.1:k==='arrowdown'?-.1:0; dx=k==='arrowright'?.1:k==='arrowleft'?-.1:0; }
  else if(k===' '){ who=0; ok=true; } else if(k==='enter'){ who=mode==='ai'?0:1; ok=true; }
  if(who<0) return; e.preventDefault();
  const p=players[who]; if(p.ready) return;
  if(ok) return setReady(p);
  p.stick.x=clampNum(p.stick.x+dx,-1,1); p.stick.y=clampNum(p.stick.y+dy,-1,1);
  updatePreview(p); renderStick(p);
});

// ---------- AI ----------
// 以 0.1s 粗步長模擬候選操作（油門×轉向），beam search 向前看數秒；
// 評分＝沿賽道前進距離 − 偏離中線 − 車頭與賽道方向偏差 − 入彎超速（依前方彎道曲率算出安全速度）
function overspeed(c){
  const cen=track.center, arc=track.arcLen, v=c.v;
  /* 前瞻距離 = 下一步可能再加速 + 煞車距離 + 餘量 */ const look=(v*1.3+v*v/(2*26)+12)/M; let minR=Infinity;
  for(let i=c.idx;i<cen.length&&arc[i]-arc[c.idx]<look;i++) if(track.curvature[i]<minR) minR=track.curvature[i];
  if(!isFinite(minR)) return 0;
  const k=1/(minR*M)-CAR.DF*9.8; if(k<=0) return 0;
  return Math.max(0, v-Math.sqrt(9.8*CAR.MU0/k)*0.95);
}
function aiScore(r){
  if(r.ev){ r.pen=0; return r.sc=(r.ev.type==='finish' ? 1e6-r.ev.t*100 : -1e5); }
  const c=r.car, cen=track.center, i0=Math.max(0,c.idx-1), i1=Math.min(cen.length-1,c.idx+1);
  const tang=Math.atan2(cen[i1].y-cen[i0].y, cen[i1].x-cen[i0].x);
  const ang=Math.abs(((c.h-tang+Math.PI*3)%(Math.PI*2))-Math.PI);
  const ov=overspeed(c);
  r.pen=c.nOut*30 + c.lat*0.6 + ang*5 + ov*ov*3;   // 每一步都累計罰分（不只終點）
  return r.sc=track.arcLen[c.idx]-r.pen;
}
const THR_F=[-1,-.5,0,.4,.7,1], STR_F=[-1,-.5,-.2,0,.2,.5,1], THR_S=[-1,0,.5,1], STR_S=[-1,-.35,0,.35,1];
function expand(c,full){
  const out=[];
  for(const thr of full?THR_F:THR_S) for(const str of full?STR_F:STR_S){
    const r=simulate(c,{thr,str},0.1,10,true); r.sc=aiScore(r); r.cmd={thr,str}; out.push(r);
  }
  return out.sort((a,b)=>b.sc-a.sc);
}
function deepValue(r,depth,beam){
  if(r.ev||depth<=0) return r.sc;
  const kids=expand(r.car,false).slice(0,beam); let best=-Infinity;
  for(const k of kids){ const v=deepValue(k,depth-1,beam); if(v>best) best=v; }
  return best-r.pen*0.7;
}
function aiDecide(p){
  if(phase!=='decide'||p.ready) return;
  const d=DIFF[aiDifficulty], c={...p.car}; c.lat=0;
  const first=expand(c,true); let best=null,bv=-Infinity;
  for(const r of first){ const v=deepValue(r,d.depth-1,d.beam); if(v>bv){bv=v;best=r;} }
  let thr=best.cmd.thr, str=best.cmd.str;
  if(d.noise){ thr+=(Math.random()*2-1)*d.noise*1.5; str+=(Math.random()*2-1)*d.noise; }
  thr=clampNum(thr,-1,1); if(thr>0) thr*=d.cap; str=clampNum(str,-1,1);
  p.stick={x:str,y:thr}; p.ready=true; p.cmd={thr,str};
  updatePanels();
  if(players.every(q=>q.ready)) startSim();
}

// ---------- 主迴圈 / 繪製 ----------
function loop(){
  if(!track){ running=false; return; }
  const now=performance.now(), dt=Math.min(0.1,(now-(lastFrame||now))/1000); lastFrame=now;
  const bar=document.getElementById('timerBar');
  if(phase==='decide'){
    const rem=Math.max(0,deadline-now);
    bar.style.width=(rem/DECIDE_MS*100)+'%';
    bar.style.background = rem<2500?'#ff5964':'var(--accent)';
    document.getElementById('phaseBadge').textContent='決策中 '+(rem/1000).toFixed(1)+'s';
    if(rem<=0){ players.forEach(p=>{ if(!p.isAI) setReady(p); else if(!p.ready) aiDecide(p); }); }
  } else if(phase==='sim'){
    bar.style.width=((1-(now-simStart)/1000)*100)+'%';
    if(now-simStart>=1000) finishSim();
  } else if(phase==='replay'&&replay){
    if(replay.playing&&!replay.scrub){ replay.t+=dt*replay.speed; if(replay.t>=replay.total){ replay.t=replay.total; replay.playing=false; rpPlay.textContent='▶'; } }
    if(!replay.scrub) rpSlider.value=replay.t/replay.total*1000;
    rpTime.textContent=replay.t.toFixed(1)+' / '+replay.total+' s';
    document.getElementById('timeBadge').textContent='t = '+replay.t.toFixed(1)+' s';
    bar.style.width=(100-replay.t/replay.total*100)+'%'; bar.style.background='var(--accent)';
  }
  players.forEach(p=>{
    const v=carView(p); document.getElementById('spd'+p.id).textContent=Math.round(v.v*3.6);
    const tg=phase==='decide'?p.stick.x:(v.ss||0);           // 方向盤：決策時跟搖桿，模擬／重播時跟實際轉向
    p.wheel+=(tg-p.wheel)*Math.min(1,dt*14);
    document.getElementById('wheel'+p.id).firstChild.style.transform='rotate('+(p.wheel*100).toFixed(1)+'deg)';
  });
  draw();
  requestAnimationFrame(loop);
}
function interp(f,k){
  k=clampNum(k,0,f.length-1); const i=Math.floor(k), j=Math.min(i+1,f.length-1), u=k-i, a=f[i], b=f[j];
  return {x:a.x+(b.x-a.x)*u, y:a.y+(b.y-a.y)*u, h:a.h+(b.h-a.h)*u, v:a.v+(b.v-a.v)*u, ss:a.ss+(b.ss-a.ss)*u, k:i};
}
function carView(p){
  if(phase==='replay'&&replay) return interp(replay.flat[p.id],replay.t/DT);
  if(phase==='sim'&&p.sim) return interp(p.sim.frames,(performance.now()-simStart)/1000/DT);
  return p.car;
}
function pathLine(pts,color,w,dash){
  ctx.beginPath(); pts.forEach((pt,i)=>{ const q=toPx(pt.x,pt.y); i?ctx.lineTo(q.x,q.y):ctx.moveTo(q.x,q.y); });
  ctx.strokeStyle=color; ctx.lineWidth=w; ctx.lineJoin='round'; ctx.setLineDash(dash||[]); ctx.stroke(); ctx.setLineDash([]);
}
function draw(){
  ctx.clearRect(0,0,cv.width,cv.height);
  if(!track) return;
  const views=players.map(carView), inRp=phase==='replay'&&replay;
  const T=inRp?replay.t:(phase==='sim'?(performance.now()-simStart)/1000:-1), fxs=[]; let shake=0;
  if(T>=0) (inRp?replay.hits:curHits).forEach(h=>{ const age=T-h.t; if(age>=0&&age<0.8){ fxs.push({h,age}); if(age<0.3) shake=Math.max(shake,Math.min(6,h.power*0.4)*(1-age/0.3)); } });
  if(follow){
    const tg = mode==='ai'?[views[0]]:views, cx=tg.reduce((s,v)=>s+v.x,0)/tg.length, cy=tg.reduce((s,v)=>s+v.y,0)/tg.length;
    offsetX=wrap.clientWidth/2-cx*scale; offsetY=wrap.clientHeight/2-cy*scale;
  }
  ctx.save(); if(shake>0) ctx.translate((Math.random()-.5)*shake*2,(Math.random()-.5)*shake*2);
  const a=toPx(0,0); ctx.strokeStyle='rgba(255,255,255,0.12)'; ctx.lineWidth=1; ctx.strokeRect(a.x,a.y,GRID*scale,GRID*scale);

  ctx.beginPath();
  track.polygon.forEach((p,i)=>{ const q=toPx(p.x,p.y); i?ctx.lineTo(q.x,q.y):ctx.moveTo(q.x,q.y); });
  ctx.closePath(); ctx.fillStyle='rgba(60,90,70,0.55)'; ctx.fill();
  [track.left,track.right].forEach(cu=>pathLine(cu,'#e8c15a',2.5));
  drawGate(track.startGate,'#5ad1ff'); drawGate(track.finishGate,'#ff5d5d');

  players.forEach((p,i)=>{
    let pts, marks=p.marks;
    if(inRp){
      const f=replay.flat[i], kk=Math.min(f.length-1,Math.floor(replay.t/DT)); pts=[];
      for(let n=0;n<=kk;n+=3) pts.push(f[n]); pts.push(views[i]);
      marks=[]; for(let s=1;s*SUB<=kk;s++) marks.push(f[s*SUB]);
    } else {
      pts=p.trail.slice();
      if(phase==='sim'&&p.sim){ const f=p.sim.frames, k=views[i].k; for(let n=0;n<=k;n+=2) pts.push(f[n]); pts.push(views[i]); }
    }
    pathLine(pts,p.color,2.5);
    marks.forEach(m=>{ const q=toPx(m.x,m.y); ctx.beginPath(); ctx.arc(q.x,q.y,3.5,0,7); ctx.fillStyle=p.color; ctx.fill(); ctx.strokeStyle='#0c1119'; ctx.lineWidth=1; ctx.stroke(); });
    if(phase==='decide'&&!p.isAI&&p.preview){
      const fr=p.preview.frames; pathLine(fr,'rgba(255,255,255,0.85)',2,[5,4]);
      const e=toPx(fr[fr.length-1].x,fr[fr.length-1].y);
      ctx.beginPath(); ctx.arc(e.x,e.y,7,0,7); ctx.fillStyle=p.preview.ev&&p.preview.ev.type==='crash'?'rgba(255,60,60,.8)':'rgba(255,255,255,.35)'; ctx.fill(); ctx.strokeStyle=p.color; ctx.lineWidth=2; ctx.stroke();
    }
  });
  // 碰撞痕跡（橘色 ✕）
  (inRp?replay.hits.filter(h=>h.t<=replay.t):hitMarks).forEach(h=>{ const q=toPx(h.x,h.y); ctx.strokeStyle='#ff9a3c'; ctx.lineWidth=2.5; ctx.beginPath(); ctx.moveTo(q.x-5,q.y-5); ctx.lineTo(q.x+5,q.y+5); ctx.moveTo(q.x+5,q.y-5); ctx.lineTo(q.x-5,q.y+5); ctx.stroke(); });
  players.forEach((p,i)=>drawCar(views[i],p.color,p.wheel));
  // 碰撞特效：衝擊環、火花、文字
  fxs.forEach(({h,age})=>{
    const q=toPx(h.x,h.y);
    ctx.save(); ctx.globalAlpha=1-age/0.8;
    ctx.beginPath(); ctx.arc(q.x,q.y,8+age*70,0,7); ctx.strokeStyle='#ffd45a'; ctx.lineWidth=3; ctx.stroke();
    ctx.strokeStyle='#ff9a3c'; ctx.lineWidth=2;
    for(let n=0;n<12;n++){ const ang=n*0.5236+h.t*7, r0=6+age*50, r1=r0+14+Math.sin(n*5.1)*6;
      ctx.beginPath(); ctx.moveTo(q.x+Math.cos(ang)*r0,q.y+Math.sin(ang)*r0); ctx.lineTo(q.x+Math.cos(ang)*r1,q.y+Math.sin(ang)*r1); ctx.stroke(); }
    ctx.font='bold 18px sans-serif'; ctx.textAlign='center'; ctx.fillStyle='#fff'; ctx.fillText('💥 碰撞！',q.x,q.y-22-age*20);
    ctx.restore();
  });
  ctx.restore();
}
function drawCar(v,color,wheel){
  const q=toPx(v.x,v.y), k=Math.max(scale,5), st=wheel||0;   // 車身至少畫成 ~5 px/m，輪胎轉向才看得清楚
  ctx.save(); ctx.translate(q.x,q.y); ctx.rotate(v.h); ctx.scale(k,k);
  ctx.strokeStyle='#666'; ctx.lineWidth=0.12;
  for(const fx of [1.8,-1.8]){ ctx.beginPath(); ctx.moveTo(fx,-0.8); ctx.lineTo(fx,0.8); ctx.stroke(); }   // 車軸
  for(const fx of [1.8,-1.8]) for(const fy of [-0.8,0.8]){
    ctx.save(); ctx.translate(fx,fy);
    if(fx>0) ctx.rotate(st*0.55);                                  // 前輪隨轉向偏轉（約 ±31°）
    ctx.fillStyle='#111'; ctx.fillRect(-0.55,-0.25,1.1,0.5);
    if(fx>0){ ctx.fillStyle='#ddd'; ctx.fillRect(-0.4,-0.04,0.8,0.08); }   // 胎面標記，讓轉動清楚可見
    ctx.restore();
  }
  ctx.fillStyle=color;
  ctx.beginPath(); ctx.moveTo(2.9,0); ctx.lineTo(1.2,-0.35); ctx.lineTo(-0.5,-0.5); ctx.lineTo(-2.4,-0.4); ctx.lineTo(-2.4,0.4); ctx.lineTo(-0.5,0.5); ctx.lineTo(1.2,0.35); ctx.closePath(); ctx.fill();
  ctx.fillRect(2.4,-0.95,0.4,1.9); ctx.fillRect(-2.9,-0.7,0.4,1.4);      // 前後尾翼
  ctx.fillStyle='#0c1119'; ctx.fillRect(-0.4,-0.2,0.9,0.4);               // 駕駛艙
  ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(-0.05,0,0.2,0,7); ctx.fill();   // 頭盔
  ctx.save(); ctx.translate(0.4,0); ctx.rotate(st*1.6); ctx.fillStyle='#ddd'; ctx.fillRect(-0.06,-0.26,0.12,0.52); ctx.restore();  // 方向盤
  ctx.restore();
}
function drawGate(g,color){ pathLine(g,color,3); }

// ---------- 視角（縮放／拖曳） ----------
let dragging=false, dragStart=null, dragOrig=null, pinchD=null, pinchS=null, pinchMid=null;
wrap.addEventListener('mousedown',e=>{ dragging=true; dragStart={x:e.clientX,y:e.clientY}; dragOrig={x:offsetX,y:offsetY}; });
window.addEventListener('mouseup',()=>{ dragging=false; });
window.addEventListener('mousemove',e=>{ if(dragging&&!follow){ offsetX=dragOrig.x+e.clientX-dragStart.x; offsetY=dragOrig.y+e.clientY-dragStart.y; } });
const td=(a,b)=>Math.hypot(b.clientX-a.clientX,b.clientY-a.clientY);
wrap.addEventListener('touchstart',e=>{
  const r=cv.getBoundingClientRect();
  if(e.touches.length===1){ dragging=true; dragStart={x:e.touches[0].clientX,y:e.touches[0].clientY}; dragOrig={x:offsetX,y:offsetY}; pinchD=null; }
  else if(e.touches.length===2){ dragging=false; pinchD=td(e.touches[0],e.touches[1]); pinchS=scale;
    pinchMid=toGrid((e.touches[0].clientX+e.touches[1].clientX)/2-r.left,(e.touches[0].clientY+e.touches[1].clientY)/2-r.top); }
  e.preventDefault();
},{passive:false});
wrap.addEventListener('touchmove',e=>{
  const r=cv.getBoundingClientRect();
  if(e.touches.length===1&&dragging&&!follow){ offsetX=dragOrig.x+e.touches[0].clientX-dragStart.x; offsetY=dragOrig.y+e.touches[0].clientY-dragStart.y; }
  else if(e.touches.length===2&&pinchD){
    scale=clampNum(pinchS*td(e.touches[0],e.touches[1])/pinchD,0.1,40);
    const mx=(e.touches[0].clientX+e.touches[1].clientX)/2-r.left, my=(e.touches[0].clientY+e.touches[1].clientY)/2-r.top, af=toPx(pinchMid.x,pinchMid.y);
    offsetX+=mx-af.x; offsetY+=my-af.y;
  }
  e.preventDefault();
},{passive:false});
wrap.addEventListener('touchend',e=>{ if(e.touches.length<2) pinchD=null; if(e.touches.length===0) dragging=false; e.preventDefault(); },{passive:false});
function zoomAt(mx,my,f){ const b=toGrid(mx,my); scale=clampNum(scale*f,0.1,40); const a=toPx(b.x,b.y); offsetX+=mx-a.x; offsetY+=my-a.y; }
wrap.addEventListener('wheel',e=>{ e.preventDefault(); const r=cv.getBoundingClientRect(); zoomAt(e.clientX-r.left,e.clientY-r.top,e.deltaY<0?1.1:0.9); },{passive:false});
document.getElementById('btnZoomIn').onclick=()=>zoomAt(wrap.clientWidth/2,wrap.clientHeight/2,1.25);
document.getElementById('btnZoomOut').onclick=()=>zoomAt(wrap.clientWidth/2,wrap.clientHeight/2,0.8);
document.getElementById('btnReset').onclick=()=>{ follow=false; document.getElementById('btnFollow').classList.remove('on'); fitView(); };
document.getElementById('btnFollow').onclick=function(){ follow=!follow; this.classList.toggle('on',follow); if(follow) scale=4.5; else fitView(); };

// ---------- 畫面切換 ----------
const homeScreen=document.getElementById('homeScreen'), gameScreen=document.getElementById('gameScreen');
document.getElementById('btnPvp').onclick=()=>{ mode='pvp'; showGame(); };
document.getElementById('btnAi').onclick=()=>{ document.getElementById('diffBox').classList.add('show'); };
document.getElementById('btnStartAi').onclick=()=>{ mode='ai'; showGame(); };
function bindSel(sel,fn){ document.querySelectorAll(sel).forEach(b=>b.onclick=()=>{ document.querySelectorAll(sel).forEach(x=>x.classList.remove('sel')); b.classList.add('sel'); fn(b); }); }
bindSel('#diffBox .diffBtn',b=>aiDifficulty=b.dataset.d);
bindSel('#lengthRow .diffBtn',b=>trackKm=parseFloat(b.dataset.km));
document.getElementById('btnHome').onclick=goHome;
document.getElementById('btnBackHome').onclick=goHome;
document.getElementById('btnAgain').onclick=()=>{ document.getElementById('overlay').classList.remove('show'); initGame(); };
document.getElementById('ok0').onclick=()=>setReady(players[0]);
document.getElementById('ok1').onclick=()=>setReady(players[1]);
function showGame(){
  homeScreen.style.display='none'; gameScreen.style.display='flex';
  document.getElementById('overlay').classList.remove('show');
  follow=true; document.getElementById('btnFollow').classList.add('on');
  requestAnimationFrame(()=>{ resizeCanvas(); initGame(); });
}
function goHome(){
  phase='idle'; track=null; players=[]; replay=null; replayBar.classList.remove('show'); gameScreen.style.display='none'; homeScreen.style.display='flex';
  document.getElementById('diffBox').classList.remove('show'); document.getElementById('overlay').classList.remove('show');
}
const WHEEL_SVG='<svg viewBox="0 0 100 100"><rect x="14" y="24" width="72" height="52" rx="20" style="fill:#10172a;stroke:var(--c);stroke-width:6"/><rect x="2" y="28" width="16" height="44" rx="7" style="fill:var(--c)"/><rect x="82" y="28" width="16" height="44" rx="7" style="fill:var(--c)"/><rect x="45" y="4" width="10" height="22" rx="3" fill="#fff"/><circle cx="50" cy="50" r="9" style="fill:var(--c)"/></svg>';
['wheel0','wheel1'].forEach(id=>{ document.getElementById(id).innerHTML=WHEEL_SVG; });

// ---------- 重播 ----------
const rpPlay=document.getElementById('rpPlay'), rpSlider=document.getElementById('rpSlider'), rpTime=document.getElementById('rpTime'), rpSpeed=document.getElementById('rpSpeed'), replayBar=document.getElementById('replayBar');
const RP_SPEEDS=[0.25,0.5,1,2,4];
function startReplay(){
  if(!history.length) return;
  const flat=[0,1].map(k=>{ const arr=[]; history.forEach((h,si)=>{ const fr=h.frames[k]; for(let i=si===0?0:1;i<fr.length;i++) arr.push(fr[i]); }); return arr; });
  const hits=[]; history.forEach(h=>h.hits.forEach(x=>hits.push(x)));
  replay={flat,hits,t:0,playing:true,speed:1,total:history.length,scrub:false};
  phase='replay'; players.forEach(p=>{ p.wheel=0; });
  document.getElementById('overlay').classList.remove('show'); replayBar.classList.add('show');
  rpPlay.textContent='⏸'; rpSpeed.textContent='1×'; updatePanels();
}
function exitReplay(){
  replay=null; replayBar.classList.remove('show'); phase='over';
  document.getElementById('overlay').classList.add('show'); updatePanels();
}
rpPlay.onclick=()=>{ if(!replay) return; if(replay.t>=replay.total){ replay.t=0; replay.playing=true; } else replay.playing=!replay.playing; rpPlay.textContent=replay.playing?'⏸':'▶'; };
rpSlider.addEventListener('pointerdown',()=>{ if(replay) replay.scrub=true; });
window.addEventListener('pointerup',()=>{ if(replay) replay.scrub=false; });
rpSlider.addEventListener('input',()=>{ if(replay) replay.t=rpSlider.value/1000*replay.total; });
rpSpeed.onclick=()=>{ if(!replay) return; const i=(RP_SPEEDS.indexOf(replay.speed)+1)%RP_SPEEDS.length; replay.speed=RP_SPEEDS[i]; rpSpeed.textContent=replay.speed+'×'; };
document.getElementById('rpExit').onclick=exitReplay;
document.getElementById('btnReplay').onclick=startReplay;
// 避免畫布的拖曳／縮放／touch preventDefault 吃掉重播列與結果視窗的操作
['replayBar','overlay'].forEach(id=>{ const el=document.getElementById(id);
  ['mousedown','touchstart','touchmove','touchend','wheel'].forEach(n=>el.addEventListener(n,e=>e.stopPropagation(),{passive:true})); });

makeStick(0); makeStick(1);
})();
</script>
